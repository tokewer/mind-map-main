name: 功能建议 (Feature Request)
description: 提出对复习思维导图的功能建议或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 请清晰描述当前的痛点或使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望新增或改动的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有任何替代的解决思路
    validations:
      required: false
